[package]
name = "orchid-app"
description = "Orchid desktop application: owns the main loop and boots the UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "orchid"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
ratatui = "0.30"
tokio = { workspace = true }
tracing.workspace = true
tracing-subscriber.workspace = true

orchid-storage.workspace = true
orchid-i18n.workspace = true
orchid-ui.workspace = true

# Orchid's workload is allocation-heavy (Slint models, terminal raster, Tantivy,
# image decode). The Windows system allocator is the weakest link there.
[target.'cfg(windows)'.dependencies]
mimalloc.workspace = true

[build-dependencies]
winres.workspace = true
