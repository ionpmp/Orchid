blake3.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
bincode_reloaded.workspace = true
thiserror.workspace = true
tracing.workspace = true
parking_lot.workspace = true
chrono.workspace = true
uuid.workspace = true
tokio = { workspace = true }
dashmap.workspace = true

pdfium-render.workspace = true
libloading.workspace = true
quick-xml.workspace = true
parley.workspace = true
swash.workspace = true
zip.workspace = true
kamadak-exif.workspace = true
libjpeg-turbo-rs.workspace = true
qcms.workspace = true
id3.workspace = true
rfd.workspace = true
sha2.workspace = true
md-5.workspace = true
hex.workspace = true

orchid-core.workspace = true
orchid-storage.workspace = true
orchid-fs.workspace = true

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_UI_ColorSystem",
    "Win32_UI_WindowsAndMessaging",
]

# Archive readers are wrapped through orchid-fs; direct deps are not needed
# in the viewers crate.

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true }
zip.workspace = true
tiff = "0.11"
