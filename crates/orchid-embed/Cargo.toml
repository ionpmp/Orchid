[package]
name = "orchid-embed"
description = "Sentence embedding backends for Orchid (stub for CI; optional ORT)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# ONNX Runtime plus the compiled-in quantized hash encoder.
ort = ["dep:ort"]

[dependencies]
orchid-format.workspace = true
thiserror.workspace = true
tracing.workspace = true
ort = { version = "=2.0.0-rc.12", optional = true, default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-native"] }

[dev-dependencies]
tempfile.workspace = true
